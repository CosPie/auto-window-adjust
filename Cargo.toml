[package]
name = "auto-window-adjust"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "A small Windows tray utility that fits dragged windows into the destination monitor."
repository = "https://github.com/CosPie/auto-window-adjust"

[[bin]]
name = "AutoWindowAdjust"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
  "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Registry",
  "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
